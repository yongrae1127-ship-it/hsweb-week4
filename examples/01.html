<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4주차 예제 1 · img 태그</title>
</head>
<body>
  <!--
  4주차 예제 1 — img 태그
  -->
  <img src="photo.jpg" alt="캠퍼스 잔디밭에서 찍은 단체 사진" width="400">

  <!-- src : 이미지 파일의 위치 (필수)
       alt : 이미지를 볼 수 없을 때 대신 읽히는 글 (필수)
       width/height : 크기. 지정해 두면 로딩 중 화면이 덜컹거리지 않는다 -->
</body>
</html>
